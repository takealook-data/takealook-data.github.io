<div id="giscus-container"></div>
<script>
(function () {
  /* giscus를 현재 사이트 테마에 맞춰 로드하고, 토글 시 postMessage로 동기화.
     compress_html 안전: 블록 주석만 사용 */
  function siteTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }

  var s = document.createElement('script');
  s.src = 'https://giscus.app/client.js';
  s.async = true;
  s.crossOrigin = 'anonymous';
  var attrs = {
    'data-repo': '{{ site.comments.giscus.repo }}',
    'data-repo-id': '{{ site.comments.giscus.repo_id }}',
    'data-category': '{{ site.comments.giscus.category_name }}',
    'data-category-id': '{{ site.comments.giscus.category_id }}',
    'data-mapping': 'pathname',
    'data-strict': '0',
    'data-reactions-enabled': '1',
    'data-emit-metadata': '1',
    'data-input-position': 'bottom',
    'data-theme': siteTheme(),
    'data-lang': 'ko'
  };
  for (var k in attrs) { s.setAttribute(k, attrs[k]); }
  document.getElementById('giscus-container').appendChild(s);

  /* 토글 주체(_main.js)와 무관하게 html data-theme 변화를 감지해 giscus에 반영 */
  var observer = new MutationObserver(function () {
    var iframe = document.querySelector('iframe.giscus-frame');
    if (!iframe) { return; }
    iframe.contentWindow.postMessage(
      { giscus: { setConfig: { theme: siteTheme() } } },
      'https://giscus.app'
    );
  });
  observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
